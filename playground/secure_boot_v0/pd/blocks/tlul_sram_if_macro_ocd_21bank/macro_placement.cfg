# Instance Name X Y Orientation
# 21 banks (4 byte-lane macros each), 3x7 grid. Macro real size is
# 301.3 x 224.93um (confirmed from .lef) -- lane pitch 350um, bank
# row pitch 280um give clean non-overlapping margins.
#
# DELIBERATE 3um X OFFSET on gen_byte[2] of banks 2/5/8/11/14/17/20 (the
# rightmost bank column's third lane) -- at the stock X=3750.0, this macro's
# own VSS pin fingers never land on either of the two Metal4 global-grid
# verticals crossing it (local X=5.62/159.22), while VDD's fingers happen to
# coincide with BOTH by LEF-layout luck (PSM-0039/PSM-0069, confirmed via
# direct ODB queries). Every same-layer bridging attempt (Metal1/2/3/4
# stripes, rings, connects) either failed to reconnect VSS or shorted it to
# VDD, because VDD's finger geometry directly straddles the only available
# approach at the stock position. Shifting -3um moves the second crossing
# (now at local X=162.22-163.82) into VSS's own finger at local 161.115-
# 164.615 (comfortably inside, ~0.8-1.1um margin both sides, and inside the
# 160.415-165.315 gap between VDD's neighboring fingers -- no VDD collision),
# while the first crossing (now at local X=8.62-10.22) stays fully inside
# VDD's own finger at 7.135-10.635, so VDD keeps its working connection too.
