# Instance Name X Y Orientation
# 2 banks (4 byte-lane macros each), 1x2 grid (single column, 2 rows).
# Bisection floor case: smallest possible OCD multibank macro, to test
# whether the PDN via-array DRC defect (V1.1/V1.2a/V2.1/V2.2a/V2.2b,
# 556676 errors on the 21-bank block) is present even at minimum scale,
# or whether it only emerges as bank count/PDN density grows. Reuses the
# exact column-0 lane geometry (X=50/400/750/1100, 350um pitch) and
# 280um row pitch from the proven 7-bank/21-bank layouts.

gen_macros[0].u_mem.gen_byte[0].u_macro 50.0 50.0 N
gen_macros[0].u_mem.gen_byte[1].u_macro 400.0 50.0 N
gen_macros[0].u_mem.gen_byte[2].u_macro 750.0 50.0 N
gen_macros[0].u_mem.gen_byte[3].u_macro 1100.0 50.0 N

