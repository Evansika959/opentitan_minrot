# Instance Name X Y Orientation
# 4 banks (4 byte-lane macros each), 1x4 grid (single column, 4 rows) --
# same convention as the 2-bank/7-bank/10-bank blocks: each bank is one row
# of 4 lanes at 350um pitch (X=50/400/750/1100), rows stacked at 280um
# pitch (Y=50/330/610/890). This is the closest-to-square arrangement
# achievable for 16 real SRAM lane-cells at 301.3x224.93um each -- going
# to fewer lanes/row (e.g. 2 or 3) reduces width but increases row count
# enough that height grows faster than width shrinks, moving further from
# square, not closer. Reuses the exact proven lane geometry from the
# 2-bank/7-bank/10-bank blocks, just 4 rows instead of 2/7/10.

gen_macros[0].u_mem.gen_byte[0].u_macro 50.0 50.0 N
gen_macros[0].u_mem.gen_byte[1].u_macro 400.0 50.0 N
gen_macros[0].u_mem.gen_byte[2].u_macro 750.0 50.0 N
gen_macros[0].u_mem.gen_byte[3].u_macro 1100.0 50.0 N

