# Instance Name X Y Orientation
# 7 banks (4 byte-lane macros each), 1x7 grid (single column, 7 rows).
# Reuses column-0 lane geometry (X=50/400/750/1100, 350um pitch) and the
# same 280um row pitch from the proven 21-bank layout, scaled down from a
# 3x7 grid to 1x7. Deliberately did NOT carry over that layout's -3um X
# offset hack on the third bank column -- this layout never uses that
# column's X position at all (only ever reuses column-0's X=50/400/750/1100,
# which never needed the offset in the original design), so the PDN-crossing
# issue that motivated the offset shouldn't apply here.
# Still: UNVALIDATED starting point -- expect to iterate on real DRC/PDN
# feedback from an actual run, same as the 21-bank layout originally was.

