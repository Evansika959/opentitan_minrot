# Explicit pin placement for xbar_tlul_2to4 (replaces LibreLane's default auto-scatter).
# Grouped by interface to match dataflow / make the block tile-able in the SoC:
#   West  = the two Ibex hosts (instruction + data)
#   East  = ROM + exec-SRAM devices
#   North = data-SRAM + UART devices
#   South = control (clock, reset, scan)
# Each section header (#side) is followed by regexes; matching pins are placed on that
# side, low->high coordinate, in the order listed. Pin spacing is auto (track-based):
# ~294 slots per 400um edge, so the W/E/N sides each carry 2 interfaces (360 pins)
# and the die is sized to 560um/side (~410 slots) to hold them. The block is
# genuinely pin-bound (6 x 180-pin TL interfaces = 1080 pins), so the die area is
# set by the pin ring, not the (tiny) core logic.

#W
tl_h_i_.*
tl_h_d_.*

#E
tl_d_rom_.*
tl_d_esram_.*

#N
tl_d_dmem_.*
tl_d_uart_.*

#S
clk_i
rst_ni
scanmode_i.*
